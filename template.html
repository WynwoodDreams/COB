<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christian's Opportunity Board</title>
<meta name="description" content="South Florida internships, searchable by major, county or area, with direct apply links.">
<link rel="canonical" href="https://cob-eta.vercel.app/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F5A524'/%3E%3Crect x='16' y='19' width='32' height='6' rx='3' fill='%231A1200'/%3E%3Crect x='16' y='30' width='32' height='6' rx='3' fill='%231A1200'/%3E%3Crect x='16' y='41' width='20' height='6' rx='3' fill='%231A1200'/%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Christian's Opportunity Board">
<meta property="og:title" content="Christian's Opportunity Board">
<meta property="og:description" content="Open internships across Miami-Dade, Broward and Palm Beach. Filter by major, county and term, then apply straight to the employer.">
<meta property="og:url" content="https://cob-eta.vercel.app/">
<meta property="og:image" content="https://cob-eta.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Christian's Opportunity Board, South Florida internships">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Christian's Opportunity Board">
<meta name="twitter:description" content="Open internships across Miami-Dade, Broward and Palm Beach. Filter by major, county and term, then apply straight to the employer.">
<meta name="twitter:image" content="https://cob-eta.vercel.app/og.png">
<meta name="theme-color" content="#121417">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121417; --panel:#1A1D22; --panel-2:#20242B; --rule:#2B313A; --rule-2:#3A414C;
  --ink:#ECEFF3; --mute:#9AA3AF; --dim:#6B7380;
  --amber:#F5A524; --amber-2:#FFC457; --amber-dim:rgba(245,165,36,.14);
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit} button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:26px 24px 60px}

/* header */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--rule)}
.head h1{font-family:var(--mono);font-weight:600;font-size:clamp(22px,3.2vw,34px);letter-spacing:-.01em;margin:0;line-height:1.1}
.head h1 span{color:var(--amber)}
.head .sub{font-family:var(--mono);font-size:12px;color:var(--mute);margin-top:6px}
.stats{display:flex;gap:22px;font-family:var(--mono);font-size:12px;color:var(--mute)}
.stats b{display:block;color:var(--ink);font-size:22px;font-weight:600;line-height:1.1}

/* search */
.search{display:flex;gap:8px;margin:20px 0 0}
.search input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--rule-2);color:var(--ink);border-radius:8px;padding:13px 16px;font-size:16px;font-family:var(--sans)}
.search input::placeholder{color:var(--dim)}
.search input:focus{border-color:var(--amber);outline:none}
.search button{background:var(--amber);color:#1A1200;border:0;border-radius:8px;padding:0 20px;font-family:var(--mono);font-weight:600;font-size:13px}
.search button.clear{background:var(--panel-2);color:var(--ink);display:none}
.search button.clear.show{display:block}

/* layout */
.layout{display:grid;grid-template-columns:260px 1fr;gap:26px;margin-top:22px;align-items:start}
.layout>*{min-width:0}
.areas{position:sticky;top:16px}
.areas h2{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.area-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.area-list button{width:100%;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center;background:transparent;border:1px solid transparent;color:var(--mute);padding:8px 10px;border-radius:6px;font-size:14px;font-weight:500;line-height:1.25}
.area-list button:hover{color:var(--ink);background:var(--panel)}
.area-list button[aria-pressed="true"]{color:var(--ink);background:var(--amber-dim);border-color:rgba(245,165,36,.35)}
.area-list button i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--dim);flex:none}
.area-list button[aria-pressed="true"] i{color:var(--amber)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:12px}
.filters label{display:flex;flex-direction:column;gap:4px;min-width:0;font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.04em}
.filters select{font:inherit;font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--panel-2);border:1px solid var(--rule-2);border-radius:6px;padding:8px 10px;min-width:170px;max-width:240px}
.filters .toggle{flex-direction:row;align-items:center;gap:8px;font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--panel-2);border:1px solid var(--rule-2);border-radius:6px;padding:8px 12px;letter-spacing:0}
.filters .toggle input{accent-color:var(--amber);width:15px;height:15px;margin:0}
.filters .reset{margin-left:auto;background:transparent;border:1px solid var(--rule-2);color:var(--mute);border-radius:6px;padding:8px 12px;font-family:var(--mono);font-size:12px}
.filters .reset:hover{color:var(--ink);border-color:var(--amber)}
.filters .copy{background:transparent;border:1px solid var(--rule-2);color:var(--mute);border-radius:6px;padding:8px 12px;font-family:var(--mono);font-size:12px}
.filters .copy:hover{color:var(--ink);border-color:var(--amber)}
.filters .copy.done{color:var(--amber);border-color:var(--amber)}

/* filter toggle, phones only */
.fbar{display:none}
.fbar button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--rule-2);color:var(--ink);border-radius:8px;padding:12px 14px;font-family:var(--mono);font-size:13px;font-weight:600}
.fbar button i{font-style:normal;color:var(--dim);font-size:12px}
.fbar button .on{color:var(--amber)}

.resultbar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:18px 0 10px}
.resultbar h2{font-family:var(--mono);font-weight:600;font-size:16px;margin:0}
.resultbar h2 em{font-style:normal;color:var(--amber)}
.resultbar .note{font-family:var(--mono);font-size:12px;color:var(--mute)}

/* rows */
.rows{display:flex;flex-direction:column;gap:8px}
.row{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:8px 20px;align-items:start}
.row:hover{border-color:var(--rule-2)}
.row .main{min-width:0}
.row .co{font-family:var(--mono);font-size:12px;color:var(--amber);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.row .co .emp{font-size:13.5px;font-weight:600;letter-spacing:-.005em}
.row .co time{color:var(--dim)}
.row .co time.fresh{color:var(--amber-2)}
.row .co time.stale{color:#8A7A55}
.row .co .loc{color:var(--mute)}
.row .srcline{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:8px}
.row .srcline a{color:var(--mute)}
.row h3{margin:4px 0 6px;font-size:18px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:5px;background:var(--panel-2);border:1px solid var(--rule-2);color:var(--mute)}
.chip.term{color:var(--ink)}
.chip.pay{color:var(--amber-2);border-color:rgba(245,165,36,.4);background:var(--amber-dim)}
.chip.flag{color:#F58B8B;border-color:rgba(245,139,139,.35);background:rgba(245,139,139,.08)}
.chip.mode{color:#8FD3A8;border-color:rgba(143,211,168,.35);background:rgba(143,211,168,.08)}
.row p{margin:0;font-size:14px;color:var(--mute);max-width:80ch}
.majors{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.majors button{font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:5px;background:transparent;border:1px dashed var(--rule-2);color:var(--mute)}
.majors button:hover{color:var(--amber);border-color:var(--amber);border-style:solid}
.row .side{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:150px}
.apply{background:var(--amber);color:#1A1200;text-decoration:none;font-family:var(--mono);font-weight:600;font-size:13px;padding:10px 16px;border-radius:7px;text-align:center}
.apply:hover{background:var(--amber-2)}
.more{background:transparent;border:1px solid var(--rule-2);color:var(--mute);border-radius:7px;padding:9px 12px;font-family:var(--mono);font-size:12px}
.more:hover,.more[aria-expanded="true"]{color:var(--ink);border-color:var(--ink)}
.details{display:none;grid-column:1/-1;border-top:1px solid var(--rule);padding-top:12px;margin-top:4px;font-size:14px}
.details.open{display:block}
.details h4{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:10px 0 6px;font-weight:600}
.details h4:first-child{margin-top:0}
.details ul{margin:0;padding-left:18px;color:var(--mute)}
.details li{margin:3px 0}
.locs{display:flex;flex-wrap:wrap;gap:6px}
.locs a{text-decoration:none;background:var(--panel-2);border:1px solid var(--rule-2);border-radius:6px;padding:7px 11px;font-size:13px;color:var(--ink);display:inline-flex;gap:8px;align-items:center}
.locs a span{font-family:var(--mono);font-size:11px;color:var(--amber)}
.details .src{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:10px}
.details .src a{color:var(--mute)}

.empty{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:40px;text-align:center}
.empty h3{margin:0 0 6px;font-size:20px}
.empty p{color:var(--mute);margin:0 0 14px}
.empty button,.loadmore{background:transparent;border:1px solid var(--amber);color:var(--amber);border-radius:7px;padding:11px 20px;font-family:var(--mono);font-size:13px;font-weight:600}
.loadmore{align-self:center;margin-top:10px}
.empty button:hover,.loadmore:hover{background:var(--amber);color:#1A1200}

.foot{margin-top:40px;border-top:1px solid var(--rule);padding-top:16px;font-family:var(--mono);font-size:12px;color:var(--dim);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:900px){
  .wrap{padding:18px 14px 48px}
  .head{align-items:flex-start}
  .stats{gap:16px}
  .search{flex-direction:column}
  .search button{padding:12px}
  .layout{grid-template-columns:1fr;gap:16px}
  .areas{position:static}
  .area-list{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px;scrollbar-width:thin}
  .area-list li{flex:none}
  .area-list button{white-space:nowrap;border-color:var(--rule);background:var(--panel);font-size:13px}
  .search #go{display:none}
  .fbar{display:block;margin-top:10px}
  .filters{margin-top:8px}
  .filters.collapsed{display:none}
  .filters label{flex:1 1 calc(50% - 4px)}
  .filters select{min-width:0;width:100%;max-width:none}
  .filters .reset,.filters .copy,.filters .toggle{flex:1 1 calc(50% - 4px);justify-content:center;margin-left:0}
  .row{grid-template-columns:1fr}
  .row .side{flex-direction:row}
  .row .side .apply{flex:1}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="head">
    <div>
      <h1>Christian's <span>Opportunity Board</span></h1>
      <div class="sub">South Florida internships · direct apply links · updated __DATE__</div>
    </div>
    <div class="stats">
      <div><b id="st-open">0</b>internships</div>
      <div><b id="st-emp">0</b>employers</div>
      <div><b id="st-areas">0</b>areas</div>
      <div><b id="st-paid">0</b>list pay</div>
    </div>
  </header>

  <form class="search" role="search">
    <input id="q" type="search" placeholder="Search by company, title, major, or keyword" autocomplete="off" aria-label="Search internships">
    <button type="button" class="clear" id="clearq">Clear</button>
    <button type="button" id="go">Search</button>
  </form>

  <div class="layout">
    <aside class="areas" aria-label="Areas">
      <h2>Area</h2>
      <ul class="area-list" id="areas"></ul>
    </aside>

    <main>
      <div class="fbar"><button type="button" id="filter-toggle" aria-expanded="false" aria-controls="filters"><span>Filters</span><i id="filter-count">show</i></button></div>

      <div class="filters" id="filters">
        <label>County <select id="f-county"><option value="">All counties</option></select></label>
        <label>Major <select id="f-major"><option value="">All majors</option></select></label>
        <label>Term <select id="f-term"><option value="">Any term</option></select></label>
        <label>Level <select id="f-level"><option value="">Any level</option></select></label>
        <label class="toggle"><input type="checkbox" id="f-paid"> Pay listed</label>
        <label class="toggle"><input type="checkbox" id="f-remote"> Remote or hybrid</label>
        <label>Sort <select id="f-sort"><option value="new">Newest first</option><option value="pay">Highest pay</option><option value="co">Employer A to Z</option><option value="title">Title A to Z</option></select></label>
        <button class="copy" id="copy" type="button">Copy link</button>
        <button class="reset" id="reset" type="button">Reset</button>
      </div>

      <div class="resultbar">
        <h2 id="rtitle">All areas</h2>
        <div class="note" id="rcount" role="status" aria-live="polite"></div>
      </div>
      <div class="rows" id="cards"></div>
    </main>
  </div>

  <footer class="foot">
    <span>Pulled from public postings. Listings close or change without notice. Confirm on the employer's page.</span>
    <span>Christian Ortega</span>
  </footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const safeUrl = u => /^https?:\/\//i.test(String(u||'')) ? String(u) : '';
  const PAGE = 40;
  const DEFAULTS = { q:'', area:'', county:'', major:'', term:'', level:'', paid:false, remote:false, sort:'new', shown:PAGE };
  const state = Object.assign({}, DEFAULTS);

  // Rough hourly value of a pay string, used only to rank listings against each other.
  const PER_HOUR = { hr:1, wk:1/40, mo:12/2080, yr:1/2080 };
  function hourly(pay){
    const unit = (/\/(hr|wk|mo|yr)\b/.exec(pay||'') || [,'hr'])[1];
    const nums = String(pay||'').match(/\$\s?[\d,]+(?:\.\d+)?/g);
    if (!nums) return null;
    const top = Math.max(...nums.map(n => parseFloat(n.replace(/[$,\s]/g,''))));
    return isFinite(top) ? top * PER_HOUR[unit] : null;
  }

  const DAY = 86400000, NOW = Date.now();
  const asDate = s => { const d = new Date(s+'T12:00:00'); return isNaN(d) ? null : d; };
  function ageLabel(days){
    if (days < 1) return 'today';
    if (days < 7) return days + 'd ago';
    if (days < 31) return Math.round(days/7) + 'w ago';
    if (days < 365) return Math.round(days/30) + 'mo ago';
    return Math.round(days/365) + 'y ago';
  }

  // Normalise every record once so an odd or partial row can never break rendering,
  // and precompute the lower-cased text that keyword search runs against.
  DATA.forEach((d, i) => {
    d.id = String(d.id || i).replace(/[^\w-]/g, '');
    d.company = String(d.company||''); d.title = String(d.title||'Intern'); d.cat = String(d.cat||'Other');
    ['majors','term','types','details','counties'].forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
    ['pay','level','mode','flag','snippet'].forEach(k => { d[k] = String(d[k]||''); });
    d.indeed = safeUrl(d.indeed);
    d.locs = (Array.isArray(d.locs) ? d.locs : []).map(l => ({ loc:String(l&&l.loc||''), apply:safeUrl(l&&l.apply)||d.indeed, county:String(l&&l.county||'') }));
    if (!d.locs.length) d.locs = [{ loc:'', apply:d.indeed, county:'' }];
    d.count = Math.max(1, parseInt(d.count,10)||1);
    d.posted = /^\d{4}-\d{2}-\d{2}$/.test(d.posted||'') ? d.posted : '';
    d.rate = hourly(d.pay);
    const dt = d.posted ? asDate(d.posted) : null;
    d.days = dt ? Math.max(0, (NOW - dt.getTime()) / DAY) : null;
    d.hay = [d.company, d.title, d.cat, d.majors.join(' '), d.locs.map(l=>l.loc).join(' '), d.counties.join(' '), d.term.join(' '), d.level, d.mode, d.pay, d.flag, d.snippet, d.details.join(' ')].join(' ').toLowerCase();
  });

  const count = (arr, key) => { const m = new Map(); arr.forEach(x => { const v = x[key]; (Array.isArray(v)?v:[v]).forEach(k => { if(k) m.set(k,(m.get(k)||0)+1); }); }); return m; };
  const employers = new Set(DATA.map(d => d.company.toLowerCase().replace(/[.,]/g,'').replace(/\s+-\s+.*$/,'')));
  const areaCounts = count(DATA,'cat'), majorCounts = count(DATA,'majors'), termCounts = count(DATA,'term'),
        levelCounts = count(DATA,'level'), countyCounts = count(DATA,'counties');
  $('#st-open').textContent = DATA.length; $('#st-emp').textContent = employers.size;
  $('#st-areas').textContent = areaCounts.size; $('#st-paid').textContent = DATA.filter(d => d.pay).length;

  const AREA_ORDER = ['Accounting, Tax & Audit','Finance, Banking & Insurance','Business, Management & Operations','Sales & Business Development','Marketing, Communications & PR','Software, IT, Data & AI','Civil, Structural & Environmental Engineering','Mechanical, Electrical & Manufacturing Engineering','Architecture, Construction & Design','Science, Sustainability & Environment','Health Sciences & Pharmacy','Mental Health & Social Work','Legal','Human Resources & Talent','Creative: Media, Design & Production','Hospitality, Events, Sports & Entertainment','Education, Nonprofit & Community','Skilled Trades, Automotive & Aviation'];
  const areas = AREA_ORDER.filter(a => areaCounts.has(a)).concat([...areaCounts.keys()].filter(a => !AREA_ORDER.includes(a)).sort());
  const ul = $('#areas');
  const mkArea = (label, val, n) => { const li=document.createElement('li'); const b=document.createElement('button'); b.type='button'; b.dataset.area=val; b.innerHTML=`<span>${esc(label)}</span><i>${n}</i>`; b.addEventListener('click',()=>{ state.area=(state.area===val?'':val); state.shown=PAGE; render(); }); li.appendChild(b); return li; };
  ul.appendChild(mkArea('All areas','',DATA.length));
  areas.forEach(a => ul.appendChild(mkArea(a,a,areaCounts.get(a))));

  const addOpt = (sel, k, n) => { const o=document.createElement('option'); o.value=k; o.textContent=`${k} (${n})`; sel.appendChild(o); };
  const fill = (sel, map) => [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0])).forEach(([k,n]) => addOpt(sel,k,n));
  // Counties read best largest first, and the catch-alls belong at the bottom.
  const COUNTY_LAST = ['Other Florida','South Florida','Remote'];
  [...countyCounts.entries()].sort((a,b) => (COUNTY_LAST.indexOf(a[0])>-1) - (COUNTY_LAST.indexOf(b[0])>-1) || b[1]-a[1] || a[0].localeCompare(b[0]))
    .forEach(([k,n]) => addOpt($('#f-county'), k, n));
  fill($('#f-major'), majorCounts);
  // Terms come from the data, ordered chronologically: Winter 2027 runs Dec-Feb so it sits before Spring 2027.
  const SEASONS = ['Winter','Spring','Summer','Fall'];
  const termKey = t => { const m=/^(\w+)\s+(\d{4})$/.exec(t); return m ? (+m[2])*10 + Math.max(0,SEASONS.indexOf(m[1])) : 1e9; };
  [...termCounts.keys()].sort((a,b)=>termKey(a)-termKey(b) || a.localeCompare(b)).forEach(t => addOpt($('#f-term'), t, termCounts.get(t)));
  fill($('#f-level'), levelCounts);
  const OPTIONS = { area:new Set(areas), county:new Set(countyCounts.keys()), major:new Set(majorCounts.keys()),
                    term:new Set(termCounts.keys()), level:new Set(levelCounts.keys()), sort:new Set(['new','pay','co','title']) };

  function matches(d){
    if (state.area && d.cat !== state.area) return false;
    if (state.county && !d.counties.includes(state.county)) return false;
    if (state.major && !d.majors.includes(state.major)) return false;
    if (state.term && !d.term.includes(state.term)) return false;
    if (state.level && d.level !== state.level) return false;
    if (state.paid && !d.pay) return false;
    if (state.remote && !d.mode) return false;
    if (state.q){
      const q = state.q.toLowerCase().split(/\s+/).filter(Boolean);
      if (!q.every(w => d.hay.includes(w))) return false;
    }
    return true;
  }
  function sortFn(a,b){
    if (state.sort==='co') return a.company.localeCompare(b.company) || a.title.localeCompare(b.title);
    if (state.sort==='title') return a.title.localeCompare(b.title) || a.company.localeCompare(b.company);
    // Listings with no figure sort last, then fall back to newest so the tail stays useful.
    if (state.sort==='pay') return (a.rate==null)-(b.rate==null) || (b.rate||0)-(a.rate||0) || (b.posted||'').localeCompare(a.posted||'');
    return (b.posted||'').localeCompare(a.posted||'') || a.company.localeCompare(b.company) || a.title.localeCompare(b.title);
  }
  const fmtDate = s => { const d = asDate(s||''); return d ? d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : ''; };

  function row(d){
    const el = document.createElement('article'); el.className='row';
    const locLine = d.locs.length===1 ? d.locs[0].loc : `${d.locs.length} locations`;
    const full = fmtDate(d.posted), age = d.days==null ? '' : ageLabel(d.days);
    // Freshness rides on the date itself: amber when days old, dimmed when half a year old.
    const ageClass = d.days==null ? '' : (d.days < 7 ? ' class="fresh"' : (d.days > 180 ? ' class="stale"' : ''));
    const chips = [];
    d.term.forEach(t => chips.push(`<span class="chip term">${esc(t)}</span>`));
    if (d.pay) chips.push(`<span class="chip pay">${esc(d.pay)}</span>`);
    if (d.mode) chips.push(`<span class="chip mode">${esc(d.mode)}</span>`);
    d.types.filter(t => t==='Full-time'||t==='Part-time').forEach(t => chips.push(`<span class="chip">${esc(t)}</span>`));
    if (d.level && d.level!=='Undergraduate') chips.push(`<span class="chip">${esc(d.level)}</span>`);
    if (d.flag) chips.push(`<span class="chip flag">${esc(d.flag)}</span>`);
    const majors = d.majors.map(m => `<button type="button" data-major="${esc(m)}">${esc(m)}</button>`).join('');
    const source = `${full ? `Posted ${esc(full)}` : 'Posted date unknown'}${d.indeed ? ` · <a href="${esc(d.indeed)}" target="_blank" rel="noopener">Original listing</a>` : ''}`;
    // Only offer a Details button when it opens onto something the card is not already showing.
    const hasDetails = d.details.length > 0 || d.locs.length > 1;
    const detId = `det-${d.id}`;
    const details = `
      ${d.details.length ? `<h4>What they ask for</h4><ul>${d.details.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      ${d.locs.length>1 ? `<h4>Apply by location</h4><div class="locs">${d.locs.map(l=>`<a href="${esc(l.apply)}" target="_blank" rel="noopener">${esc(l.loc)}<span>apply</span></a>`).join('')}</div>` : ''}
      <div class="src">${source}</div>`;
    el.innerHTML = `
      <div class="main">
        <div class="co"><span class="emp">${esc(d.company)}</span>${locLine ? `<span class="loc">${esc(locLine)}</span>` : ''}${age ? `<time datetime="${esc(d.posted)}" title="${esc(full)}"${ageClass}>${esc(age)}</time>` : ''}</div>
        <h3>${esc(d.title)}</h3>
        ${chips.length?`<div class="chips">${chips.join('')}</div>`:''}
        ${d.snippet ? `<p>${esc(d.snippet)}</p>` : ''}
        ${majors?`<div class="majors">${majors}</div>`:''}
        ${hasDetails ? '' : `<div class="srcline">${source}</div>`}
      </div>
      <div class="side">
        ${d.locs[0].apply ? `<a class="apply" href="${esc(d.locs[0].apply)}" target="_blank" rel="noopener">Apply ↗</a>` : ''}
        ${hasDetails ? `<button class="more" type="button" aria-expanded="false" aria-controls="${detId}">Details</button>` : ''}
      </div>
      ${hasDetails ? `<div class="details" id="${detId}">${details}</div>` : ''}`;
    const more = el.querySelector('.more');
    if (more) more.addEventListener('click', e => { const b=e.currentTarget, dt=el.querySelector('.details'); const open=!dt.classList.contains('open'); dt.classList.toggle('open',open); b.setAttribute('aria-expanded',open); b.textContent=open?'Hide':'Details'; });
    el.querySelectorAll('.majors button').forEach(b => b.addEventListener('click', () => { state.major=b.dataset.major; $('#f-major').value=state.major; state.shown=PAGE; render(); const anchor=$('.resultbar'); if(anchor) window.scrollTo({top:anchor.offsetTop-12}); }));
    return el;
  }

  const activeCount = () => ['area','county','major','term','level'].filter(k=>state[k]).length + (state.paid?1:0) + (state.remote?1:0);

  function render(){
    document.querySelectorAll('#areas button').forEach(b => { const on=b.dataset.area===state.area; b.setAttribute('aria-pressed',on?'true':'false'); if(on && state.area && window.innerWidth<=900) b.scrollIntoView({block:'nearest',inline:'center'}); });
    const list = DATA.filter(matches).sort(sortFn);
    const wrap = $('#cards'); wrap.innerHTML='';
    const qLabel = state.q ? `<em>“${esc(state.q)}”</em>` : '';
    $('#rtitle').innerHTML = state.area ? esc(state.area) + (qLabel ? ` · ${qLabel}` : '') : (qLabel ? `Results for ${qLabel}` : 'All areas');
    const openings = list.reduce((n,d)=>n+d.count,0);
    const shown = Math.min(state.shown, list.length);
    $('#rcount').textContent = list.length ? `${shown<list.length?`${shown} of `:''}${list.length} internship${list.length===1?'':'s'}${openings>list.length?` · ${openings} openings across locations`:''}` : 'No internships match';
    if (!list.length){
      wrap.innerHTML = `<div class="empty"><h3>Nothing matches.</h3><p>Try a broader search or clear a filter.</p><button type="button" id="empty-reset">Reset filters</button></div>`;
      $('#empty-reset').addEventListener('click', reset);
    } else {
      list.slice(0,state.shown).forEach(d => wrap.appendChild(row(d)));
      if (list.length > state.shown){ const b=document.createElement('button'); b.className='loadmore'; b.type='button'; b.textContent=`Show ${Math.min(PAGE,list.length-state.shown)} more`; b.addEventListener('click',()=>{ state.shown+=PAGE; render(); }); wrap.appendChild(b); }
    }
    const n = activeCount();
    $('#filter-count').innerHTML = n ? `<span class="on">${n} on</span>` : (filters.classList.contains('collapsed') ? 'show' : 'hide');
    $('#clearq').classList.toggle('show', !!state.q);
    $('#copy').classList.remove('done'); $('#copy').textContent='Copy link';
    writeHash();
  }
  function reset(){ Object.assign(state, DEFAULTS); syncInputs(); render(); }
  function syncInputs(){ $('#q').value=state.q; $('#f-county').value=state.county; $('#f-major').value=state.major; $('#f-term').value=state.term; $('#f-level').value=state.level; $('#f-paid').checked=state.paid; $('#f-remote').checked=state.remote; $('#f-sort').value=state.sort; }
  function writeHash(){
    const p=new URLSearchParams();
    ['q','area','county','major','term','level','sort'].forEach(k=>{ if(state[k] && !(k==='sort'&&state[k]==='new')) p.set(k,state[k]); });
    if(state.paid) p.set('paid','1'); if(state.remote) p.set('remote','1');
    const h=p.toString();
    try{ history.replaceState(null,'', location.pathname+location.search+(h?'#'+h:'')); }catch(e){}
  }
  // Only accept hash values that exist as options, so a stale link can't leave an invisible filter applied.
  function readHash(){
    Object.assign(state, DEFAULTS);
    let p; try{ p=new URLSearchParams(location.hash.slice(1)); }catch(e){ return; }
    state.q=(p.get('q')||'').trim().slice(0,200);
    ['area','county','major','term','level','sort'].forEach(k=>{ const v=p.get(k); if(v && OPTIONS[k].has(v)) state[k]=v; });
    state.paid=p.get('paid')==='1'; state.remote=p.get('remote')==='1';
  }

  let t;
  const setQ = v => { clearTimeout(t); state.q=v.trim(); state.shown=PAGE; render(); };
  $('#q').addEventListener('input', e => { clearTimeout(t); t=setTimeout(()=>setQ(e.target.value),180); });
  $('.search').addEventListener('submit', e => { e.preventDefault(); setQ($('#q').value); $('#q').blur(); });
  $('#go').addEventListener('click', ()=> setQ($('#q').value));
  $('#clearq').addEventListener('click', ()=>{ $('#q').value=''; setQ(''); $('#q').focus(); });
  [['f-county','county'],['f-major','major'],['f-term','term'],['f-level','level'],['f-sort','sort']].forEach(([id,k]) => $('#'+id).addEventListener('change', e => { state[k]=e.target.value; state.shown=PAGE; render(); }));
  $('#f-paid').addEventListener('change', e => { state.paid=e.target.checked; state.shown=PAGE; render(); });
  $('#f-remote').addEventListener('change', e => { state.remote=e.target.checked; state.shown=PAGE; render(); });
  $('#reset').addEventListener('click', reset);

  const filters = $('#filters');
  const setFilters = open => { filters.classList.toggle('collapsed', !open); $('#filter-toggle').setAttribute('aria-expanded', open?'true':'false'); render(); };
  filters.classList.add('collapsed');   // only takes effect under the phone breakpoint
  $('#filter-toggle').addEventListener('click', ()=> setFilters(filters.classList.contains('collapsed')));

  $('#copy').addEventListener('click', async e => {
    const b=e.currentTarget, url=location.href;
    try{
      if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(url);
      else { const ta=document.createElement('textarea'); ta.value=url; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
      b.textContent='Copied'; b.classList.add('done');
    }catch(err){ b.textContent='Press Ctrl+C'; }
  });

  window.addEventListener('hashchange', ()=>{ readHash(); syncInputs(); render(); });
  readHash(); syncInputs(); render();
})();
</script>
</body>
</html>
